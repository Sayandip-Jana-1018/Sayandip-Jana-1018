<svg xmlns="http://www.w3.org/2000/svg" width="960" height="300" viewBox="0 0 960 300">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="achieve-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080c16" />
      <stop offset="50%" stop-color="#0d1424" />
      <stop offset="100%" stop-color="#140d28" />
    </linearGradient>

    <!-- Neon Border -->
    <linearGradient id="achieve-border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff007f" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#00d9ff" />
    </linearGradient>

    <!-- Card Backgrounds -->
    <linearGradient id="inner-card-1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#111827" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>

    <style>
      .mono { font-family: 'SF Mono', 'Fira Code', 'Courier New', monospace; }
      .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
      .glow-title { text-shadow: 0 0 15px rgba(255, 0, 127, 0.4); }
      .float-1 { animation: floatA 4s ease-in-out infinite; }
      .float-2 { animation: floatB 4.5s ease-in-out infinite; }
      .float-3 { animation: floatA 5s ease-in-out infinite; }
      @keyframes floatA {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-4px); }
      }
      @keyframes floatB {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(4px); }
      }
    </style>
  </defs>

  <!-- Frame Background -->
  <rect x="4" y="4" width="952" height="292" rx="20" fill="url(#achieve-bg)" stroke="url(#achieve-border)" stroke-width="2" />

  <!-- Section Header -->
  <text class="sans glow-title" x="40" y="42" fill="#f8fafc" font-size="20" font-weight="800">🏆 Developer Achievements &amp; Verified Honors</text>
  <text class="mono" x="40" y="64" fill="#94a3b8" font-size="12">Verified National Hackathon Podiums, Algorithmic Milestones &amp; Seed Investments</text>

  <!-- Card 1: TechForge '25 -->
  <g class="float-1" transform="translate(40, 85)">
    <rect width="275" height="185" rx="14" fill="url(#inner-card-1)" stroke="#00d9ff" stroke-width="1.5" />
    <circle cx="36" cy="38" r="18" fill="#00d9ff" fill-opacity="0.15" />
    <text x="26" y="45" font-size="18">🥈</text>
    
    <text class="sans" x="65" y="32" fill="#38bdf8" font-size="11" font-weight="700">TECHFORGE '25</text>
    <text class="sans" x="65" y="48" fill="#f8fafc" font-size="14" font-weight="800">2nd Runner-Up</text>
    
    <rect x="18" y="70" width="239" height="34" rx="6" fill="#0369a1" fill-opacity="0.25" />
    <text class="sans" x="28" y="92" fill="#38bdf8" font-size="14" font-weight="800">₹5,00,000 Seed Round</text>
    
    <text class="sans" x="18" y="125" fill="#cbd5e1" font-size="11.5">Secured ₹5L seed investment in SMG with cloud-native system architecture.</text>
    <text class="mono" x="18" y="162" fill="#00d9ff" font-size="10.5">● National Hackathon · Jul 2025</text>
  </g>

  <!-- Card 2: Web-A-Thon by OnDemand -->
  <g class="float-2" transform="translate(340, 85)">
    <rect width="275" height="185" rx="14" fill="url(#inner-card-1)" stroke="#ff007f" stroke-width="1.5" />
    <circle cx="36" cy="38" r="18" fill="#ff007f" fill-opacity="0.15" />
    <text x="26" y="45" font-size="18">🥇</text>
    
    <text class="sans" x="65" y="32" fill="#f472b6" font-size="11" font-weight="700">WEB-A-THON BY ONDEMAND</text>
    <text class="sans" x="65" y="48" fill="#f8fafc" font-size="14" font-weight="800">1st Place Champion</text>
    
    <rect x="18" y="70" width="239" height="34" rx="6" fill="#be185d" fill-opacity="0.25" />
    <text class="sans" x="28" y="92" fill="#f472b6" font-size="14" font-weight="800">₹1,00,000 Cash Prize</text>
    
    <text class="sans" x="18" y="125" fill="#cbd5e1" font-size="11.5">Engineered HygieiaAI multi-agent healthcare platform with Gemini 2.0 Flash.</text>
    <text class="mono" x="18" y="162" fill="#ff007f" font-size="10.5">● National Winner · Feb 2025</text>
  </g>

  <!-- Card 3: 600+ LeetCode & Hackathons -->
  <g class="float-3" transform="translate(640, 85)">
    <rect width="280" height="185" rx="14" fill="url(#inner-card-1)" stroke="#f59e0b" stroke-width="1.5" />
    <circle cx="36" cy="38" r="18" fill="#f59e0b" fill-opacity="0.15" />
    <text x="26" y="45" font-size="18">🧠</text>
    
    <text class="sans" x="65" y="32" fill="#fbbf24" font-size="11" font-weight="700">ALGORITHMIC MASTERY</text>
    <text class="sans" x="65" y="48" fill="#f8fafc" font-size="14" font-weight="800">600+ LeetCode Solved</text>
    
    <rect x="18" y="70" width="244" height="34" rx="6" fill="#b45309" fill-opacity="0.25" />
    <text class="sans" x="28" y="92" fill="#fbbf24" font-size="14" font-weight="800">Inter-University Champion</text>
    
    <text class="sans" x="18" y="125" fill="#cbd5e1" font-size="11.5">Deep expertise in DP, Graph Theory, System Design &amp; Greedy Netting engines.</text>
    <text class="mono" x="18" y="162" fill="#fbbf24" font-size="10.5">● NPTEL IIT Guwahati &amp; Apna College</text>
  </g>

</svg>
