<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="460" height="84" viewBox="0 0 460 84" role="img" aria-label="Portfolio"><title>Portfolio</title><defs><style>@font-face{font-family:SJMono;font-weight:400;font-style:normal;src:url(data:font/woff2;base64,) format('woff2');unicode-range:U+0020,U+002E,U+0061,U+0063,U+0064,U+0065,U+0069,U+006A,U+006C,U+006E,U+0070,U+0072,U+0073,U+0076,U+0079}
