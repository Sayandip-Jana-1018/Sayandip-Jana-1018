<svg xmlns="http://www.w3.org/2000/svg" width="400" height="520" viewBox="0 0 400 520">
  <defs>
    <!-- Card Background -->
    <linearGradient id="id-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="50%" stop-color="#111827" />
      <stop offset="100%" stop-color="#1e1338" />
    </linearGradient>

    <!-- Neon Glow Border -->
    <linearGradient id="id-border" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00d9ff" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#ff007f" />
    </linearGradient>

    <!-- Lanyard Strap -->
    <linearGradient id="strap" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#6c63ff" />
      <stop offset="100%" stop-color="#00d9ff" />
    </linearGradient>

    <style>
      .mono { font-family: 'SF Mono', 'Fira Code', 'Courier New', monospace; }
      .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
      .glow-badge { text-shadow: 0 0 12px rgba(0, 217, 255, 0.5); }
      .float-badge { animation: bfloat 4s ease-in-out infinite; }
      @keyframes bfloat {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-4px); }
      }
    </style>
  </defs>

  <!-- Lanyard Top Straps -->
  <polygon points="175,0 185,0 195,50 185,50" fill="url(#strap)" opacity="0.8" />
  <polygon points="225,0 215,0 205,50 215,50" fill="url(#strap)" opacity="0.8" />
  
  <!-- Lanyard Metal Clip -->
  <rect x="180" y="45" width="40" height="15" rx="4" fill="#64748b" stroke="#94a3b8" stroke-width="1" />
  <rect x="190" y="55" width="20" height="18" rx="2" fill="#334155" />

  <!-- Badge Card Body -->
  <g class="float-badge">
    <rect x="15" y="70" width="370" height="435" rx="22" fill="url(#id-bg)" stroke="url(#id-border)" stroke-width="2.5" />

    <!-- Top Card Header -->
    <rect x="15" y="70" width="370" height="45" rx="22" fill="#0d1424" />
    <rect x="15" y="95" width="370" height="20" fill="#0d1424" />
    <line x1="15" y1="115" x2="385" y2="115" stroke="#1e293b" stroke-width="1.5" />

    <text class="mono" x="35" y="98" fill="#00d9ff" font-size="12" font-weight="700">DEV-ID: SJ-1018</text>
    <text class="mono" x="270" y="98" fill="#10b981" font-size="11">ACTIVE 🟢</text>

    <!-- Avatar Placeholder Circle with Glowing Ring -->
    <circle cx="200" cy="180" r="48" fill="#1e293b" stroke="url(#id-border)" stroke-width="3" />
    <text x="178" y="196" font-size="44">👨‍💻</text>

    <!-- Developer Name -->
    <text class="sans glow-badge" x="200" y="255" fill="#ffffff" font-size="22" font-weight="900" text-anchor="middle" letter-spacing="1">SAYANDIP JANA</text>
    <text class="mono" x="200" y="275" fill="#00d9ff" font-size="12" font-weight="600" text-anchor="middle">@Sayandip-Jana-1018</text>
    <text class="sans" x="200" y="295" fill="#94a3b8" font-size="13" font-weight="600" text-anchor="middle">Full-Stack Engineer · GenAI Architect</text>

    <!-- Divider Line -->
    <line x1="45" y1="312" x2="355" y2="312" stroke="#1e293b" stroke-width="1.5" />

    <!-- Info Metrics Grid -->
    <text class="mono" x="50" y="335" fill="#64748b" font-size="10">EDUCATION</text>
    <text class="sans" x="50" y="352" fill="#f1f5f9" font-size="12" font-weight="700">B.Tech CSE @ LPU</text>

    <text class="mono" x="230" y="335" fill="#64748b" font-size="10">ACADEMIC CGPA</text>
    <text class="sans" x="230" y="352" fill="#38bdf8" font-size="12" font-weight="800">9.11 / 10.0</text>

    <text class="mono" x="50" y="380" fill="#64748b" font-size="10">HACKATHONS</text>
    <text class="sans" x="50" y="397" fill="#fbbf24" font-size="12" font-weight="800">₹6,00,000+ Won</text>

    <text class="mono" x="230" y="380" fill="#64748b" font-size="10">LEETCODE</text>
    <text class="sans" x="230" y="397" fill="#a78bfa" font-size="12" font-weight="800">600+ Solved</text>

